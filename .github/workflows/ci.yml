name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  POLYMARKET_BOT_MODE: research
  POLYMARKET_BOT_LIVE_TRADING_ENABLED: "false"
  NODE_ENV: test

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Refuse live credentials in CI
        run: |
          if [ -n "${POLYMARKET_PRIVATE_KEY:-}" ] || [ -n "${POLYMARKET_API_SECRET:-}" ]; then
            echo "Live credentials must not be present in CI"
            exit 1
          fi

  python:
    name: Python research
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
