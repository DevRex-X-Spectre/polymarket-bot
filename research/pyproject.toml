[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-research"
version = "0.0.0"
description = "Isolated quantitative research environment. Cannot submit live orders."
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
